<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>감성 타이핑 시집</title>

  <!-- Google Fonts: 최고급 감성 한글 서체 컬렉션 -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&family=Song+Myung&family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-size: 21px;
    }
    * {
      box-sizing: border-box;
    }
    
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      padding: 2rem 1.5rem;
      font-size: var(--font-size);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1), color 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }
    
    #poem-container {
      width: 100%;
      max-width: 680px;
      padding: 3rem 1.5rem;
      box-sizing: border-box;
    }
    
    #poem {
      white-space: pre-wrap;
      line-height: 2.35;
      letter-spacing: -0.02em;
      word-break: keep-all;
      display: inline-block;
      width: 100%;
      text-align: inherit;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      text-shadow: 0 0 1px rgba(0, 0, 0, 0.04);
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0);
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                  filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                  transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #poem.fade-out {
      opacity: 0;
      filter: blur(6px);
      transform: translateY(-8px);
    }

    /* 🪶 감성적인 플로팅 메뉴 바 (Aesthetic Floating Toolbar) */
    #controls {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.5rem;
      background: rgba(128, 128, 128, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(128, 128, 128, 0.18);
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      opacity: 0.8;
      transition: opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
      z-index: 100;
      user-select: none;
    }
    #controls:hover, #controls:focus-within {
      opacity: 1;
      background: rgba(128, 128, 128, 0.14);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .ctrl-btn {
      background: rgba(128, 128, 128, 0.06);
      border: 1px solid rgba(128, 128, 128, 0.18);
      color: inherit;
      font-family: 'Gowun Batang', serif;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.32rem 0.65rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      letter-spacing: -0.02em;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      text-decoration: none;
      -webkit-font-smoothing: antialiased;
    }
    .ctrl-btn:hover {
      background: rgba(128, 128, 128, 0.2);
      border-color: rgba(128, 128, 128, 0.35);
      transform: translateY(-1px);
    }
    .ctrl-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .size-btn {
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
    }
    .sub-sign {
      font-size: 0.7rem;
      opacity: 0.85;
      margin-left: 1px;
    }

    .ctrl-icon {
      display: inline-block;
      vertical-align: middle;
      stroke: currentColor;
    }

    .ctrl-divider {
      display: inline-block;
      width: 1px;
      height: 14px;
      background: currentColor;
      opacity: 0.2;
      margin: 0 0.15rem;
    }

    @media (max-width: 640px) {
      #controls {
        top: auto;
        bottom: 1.5rem;
        right: 50%;
        transform: translateX(50%);
        padding: 0.3rem 0.45rem;
        gap: 0.25rem;
        opacity: 0.92;
      }
      #controls:hover {
        transform: translateX(50%);
      }
      .ctrl-btn {
        font-size: 0.76rem;
        padding: 0.28rem 0.48rem;
        gap: 0.25rem;
      }
      #poem-container {
        padding: 1.5rem 0.5rem 4.5rem;
      }
    }

    /* 🕯️ 숨쉬듯 깊고 부드럽게 점멸하는 잉크 커서 */
    .cursor {
      display: inline-block;
      width: 1.5px;
      height: 1.15em;
      background: currentColor;
      margin-left: 5px;
      vertical-align: -0.1em;
      border-radius: 1px;
      box-shadow: 0 0 6px currentColor;
      animation: breathe 1.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { 
        opacity: 0.85; 
        transform: scaleY(1); 
      }
      50% { 
        opacity: 0.15; 
        transform: scaleY(0.92); 
      }
    }
  </style>
</head>
<body>
  <!-- 은은한 아날로그 종이 질감 오버레이 (한지 텍스처) -->
  <svg id="paper-texture" aria-hidden="true" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;opacity:0.025;z-index:999;">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)" />
  </svg>

  <nav id="controls" aria-label="감상 메뉴">
    <div class="ctrl-group">
      <button onclick="changeFontSize(-1)" title="글자 작게" class="ctrl-btn size-btn">
        가<span class="sub-sign">−</span>
      </button>
      <button onclick="changeFontSize(1)" title="글자 크게" class="ctrl-btn size-btn">
        가<span class="sub-sign">+</span>
      </button>
    </div>

    <span class="ctrl-divider"></span>

    <button onclick="cycleAlign()" id="alignBtn" title="시 정렬 바꾸기 (좌측 / 중앙 / 우측)" class="ctrl-btn">
      <span id="alignSvgWrap"></span>
      <span id="alignText">중앙</span>
    </button>

    <span class="ctrl-divider"></span>

    <button onclick="reloadPoem()" id="reloadBtn" title="새로운 시 감상하기" class="ctrl-btn">
      <svg class="ctrl-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>다른 시</span>
    </button>

    <button onclick="toggleAutoPlay()" id="autoplayBtn" title="자동 넘김" class="ctrl-btn">
      <span id="autoplaySvg">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </span>
      <span id="autoplayText">자동 넘김</span>
    </button>
  </nav>

  <main id="poem-container">
    <div id="poem">
      <span id="typed"></span><span id="cursor" class="cursor" style="display:none"></span>
    </div>
  </main>

  <script>
    let reflections = [];
    let autoPlayInterval = null;
    let isAutoPlaying = false;
    let isTyping = false;
    let isTransitioning = false;
    let typeTimer = null;

    const ALIGNMENTS = ['left', 'center', 'right'];
    const ALIGN_CONFIG = {
      'left': {
        label: '좌측',
        svg: '<svg class="ctrl-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="14" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>'
      },
      'center': {
        label: '중앙',
        svg: '<svg class="ctrl-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>'
      },
      'right': {
        label: '우측',
        svg: '<svg class="ctrl-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>'
      }
    };
    let currentAlign = 'center';

    function setAlignment(align) {
      currentAlign = align;
      const container = document.getElementById('poem-container');
      if (container) {
        container.style.textAlign = align;
      }
      const svgWrap = document.getElementById('alignSvgWrap');
      const textSpan = document.getElementById('alignText');
      if (svgWrap && ALIGN_CONFIG[align]) {
        svgWrap.innerHTML = ALIGN_CONFIG[align].svg;
      }
      if (textSpan && ALIGN_CONFIG[align]) {
        textSpan.textContent = ALIGN_CONFIG[align].label;
      }
    }

    function cycleAlign() {
      const nextIdx = (ALIGNMENTS.indexOf(currentAlign) + 1) % ALIGNMENTS.length;
      setAlignment(ALIGNMENTS[nextIdx]);
    }

    function formatPoemText(text) {
      if (!text) return "";
      let t = text.trim();
      if (t.includes("\n\n")) {
        return t.replace(/\n{3,}/g, "\n\n");
      }
      if ((t.match(/\n/g) || []).length >= 2) {
        const lines = t.split("\n").map(l => l.trim()).filter(Boolean);
        const stanzas = [];
        let cur = [];
        for (let l of lines) {
          cur.push(l);
          if (cur.length >= 2) {
            stanzas.push(cur.join("\n"));
            cur = [];
          }
        }
        if (cur.length) stanzas.push(cur.join("\n"));
        return stanzas.join("\n\n");
      }
      const sents = t.replace(/\n/g, " ").split(/(?<=[.!?])\s+/).filter(Boolean);
      const lines = [];
      for (let s of sents) {
        if (s.length > 20) {
          if (s.includes(", ") && s.indexOf(", ") < s.length - 6) {
            const parts = s.split(", ");
            parts.forEach((p, idx) => lines.push(p + (idx < parts.length - 1 ? "," : "")));
            continue;
          }
          const clauses = ["그러니 ", "그리고 ", "하지만 ", "어쩌면 ", "우리는 ", "나는 ", "너는 "];
          let split = false;
          for (let c of clauses) {
            const idx = s.indexOf(c);
            if (idx > 5 && idx < s.length - 5) {
              lines.push(s.substring(0, idx).trim());
              lines.push(s.substring(idx).trim());
              split = true;
              break;
            }
          }
          if (!split) lines.push(s);
        } else {
          lines.push(s);
        }
      }
      const stanzas = [];
      let cur = [];
      for (let l of lines) {
        cur.push(l);
        if (cur.length >= 2) {
          stanzas.push(cur.join("\n"));
          cur = [];
        }
      }
      if (cur.length) stanzas.push(cur.join("\n"));
      return stanzas.join("\n\n");
    }

    async function loadReflections() {
      try {
        const res = await fetch('reflections.json?t=' + Date.now());
        reflections = await res.json();
        showRandomPoem(true); // 첫 로드는 즉시 표시
      } catch (e) {
        console.error("시 불러오기 실패:", e);
      }
    }

    function showRandomPoem(isInitial = false) {
      if (!reflections || reflections.length === 0) return;
      if (isTransitioning) return;

      isTransitioning = true;
      if (typeTimer) {
        clearTimeout(typeTimer);
        typeTimer = null;
      }
      isTyping = false;

      const poem = document.getElementById("poem");
      const textTarget = document.getElementById("typed");
      const cursor = document.getElementById("cursor");

      cursor.style.display = "none";

      const fadeOutTime = isInitial ? 0 : 700; // 부드러운 페이드아웃 0.7초
      if (!isInitial) {
        poem.classList.add("fade-out");
      }

      setTimeout(() => {
        // [절차 1] 기존 텍스트를 가장 먼저 완전히 비운다 (화면에 글자가 전혀 없음)
        textTarget.textContent = "";

        const random = reflections[Math.floor(Math.random() * reflections.length)];
        const poemText = formatPoemText(random.text || "");

        // 다음 적용할 정렬 선정 (아직 화면 적용하지 않음!)
        const randVal = Math.random();
        const nextAlign = randVal < 0.45 ? 'left' : randVal < 0.85 ? 'center' : 'right';

        // 배경색, 글자색, 서체 부드럽게 전환
        document.body.style.background = random.style.background;
        document.body.style.color = random.style.color;
        document.body.style.fontFamily = random.style.fontFamily;

        // [절차 2] 화면이 완전히 비어있는 고요한 정적의 순간 (0.4초 멈춤)
        setTimeout(() => {
          // [절차 3] 텍스트가 0글자인 빈 화면 상태에서, 타이핑 시작 직전에 정렬 적용!
          setAlignment(nextAlign);

          // [절차 4] 페이드인 복귀
          poem.classList.remove("fade-out");

          // [절차 5] 고급지고 안정된 마음의 속도로 타이핑 시작
          isTyping = true;
          let i = 0;

          function typeChar() {
            if (!isTyping) {
              isTransitioning = false;
              return;
            }

            if (i < poemText.length) {
              const char = poemText.charAt(i);
              textTarget.textContent += char;
              i++;

              // 🪶 고급지고 안정된 마음의 타이핑 속도 (또박또박 머무는 호흡)
              let delay = 85 + Math.random() * 35; // 기본 글자: 85~120ms

              if (char === ' ') {
                delay = 160; // 단어 사이 작은 쉼
              } else if (char === ',') {
                delay = 450; // 쉼표 뒤 반 박자 호흡
              } else if (char === '\n') {
                delay = 700; // 줄바꿈 시 깊은 숨 고르기
              } else if (char === '.' || char === '!' || char === '?') {
                delay = 850; // 문장 끝 깊은 여운이 스미는 시간
              }

              typeTimer = setTimeout(typeChar, delay);
            } else {
              cursor.style.display = "inline-block";
              isTyping = false;
              isTransitioning = false;
            }
          }

          typeChar();
        }, isInitial ? 100 : 400);
      }, fadeOutTime);
    }

    function reloadPoem() {
      if (isTransitioning) return;
      showRandomPoem(false);
    }

    function toggleAutoPlay() {
      const textSpan = document.getElementById("autoplayText");
      const svgSpan = document.getElementById("autoplaySvg");
      if (!isAutoPlaying) {
        autoPlayInterval = setInterval(() => {
          if (!isTyping && !isTransitioning) showRandomPoem(false);
        }, 18000);
        textSpan.textContent = "멈춤";
        svgSpan.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
        isAutoPlaying = true;
      } else {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        textSpan.textContent = "자동 넘김";
        svgSpan.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
        isAutoPlaying = false;
      }
    }

    function changeFontSize(delta) {
      const current = parseInt(getComputedStyle(document.body).getPropertyValue('--font-size'));
      const nextSize = Math.max(16, Math.min(32, current + delta));
      document.documentElement.style.setProperty('--font-size', `${nextSize}px`);
    }

    loadReflections();
  </script>
</body>
</html>

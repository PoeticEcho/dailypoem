<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>감성 타이핑 시집</title>
  <script>
    const path = window.location.pathname;
    const match = path.match(/^(.*\/)(\d{2,})\/?$/);
    if (match && match[1] && match[2]) {
      sessionStorage.setItem('dailypoem_redirect_code', match[2]);
      window.location.replace(match[1]);
    } else {
      if (path.includes('/dailypoem')) {
        window.location.replace('/dailypoem/');
      } else {
        window.location.replace('./');
      }
    }
  </script>
</head>
<body></body>
</html>
